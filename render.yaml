# Render deploy config для бэкенда Nebula (Postgres + Node).
# Задеплоить папку mail-relay как Web Service и приаттачить Postgres.
# В настройках сервиса задать переменные окружения (см. ниже).

services:
  - type: web
    name: nebula-relay
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: mail-relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nebula-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.yandex.ru
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Для web-push (опционально). Должны совпадать с VAPID-ключами клиента.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: nebula-db
    databaseName: nebula
    user: nebula
    plan: free
    region: frankfurt
